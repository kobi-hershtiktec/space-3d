<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION EXPLORER // The Future of Modular Space Exploration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-void: #000000;
            --cyan-glow: #00f0ff;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(8, 12, 20, 0.35);
            --glass-border: rgba(0, 240, 255, 0.2);
        }

        html, body {
            background-color: var(--bg-void);
            color: var(--text-primary);
            overflow-x: hidden;
            height: 500vh;
        }

        #media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            overflow: hidden;
            background-color: #000000;
        }

        #scrolly-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        header.hud-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            padding: 1.5rem 2.5rem;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--cyan-glow);
        }

        .content-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .section {
            position: absolute;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: var(--glass-bg);
            padding: 3rem 4rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            max-width: 680px;
            width: 90%;
        }

        .section.active {
            opacity: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div id="media-container">
        <video 
            id="scrolly-video" 
            preload="auto" 
            muted 
            playsinline 
            webkit-playsinline>
            <source src="./video.mp4" type="video/mp4">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        </video>
    </div>

    <header class="hud-header">
        <span class="logo-text">ORION // EXPLORER</span>
    </header>

    <main class="content-overlay">
        <div class="section active" id="sec-1">
            <h1>ORION EXPLORER</h1>
            <p class="subtitle">The Future of Modular Space Exploration.</p>
        </div>
        <div class="section" id="sec-2">
            <h1>MODULAR ASSEMBLY</h1>
            <p class="subtitle">Precision engineering assembled seamlessly in deep space.</p>
        </div>
        <div class="section" id="sec-3">
            <h1>ADVANCED PROPULSION</h1>
            <p class="subtitle">Powered by nuclear thermal and solar array technology.</p>
        </div>
    </main>

    <div id="root"></div>
    
    <script type="module" src="./src/main.tsx"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('scrolly-video');
            
            window.addEventListener('scroll', () => {
                const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                const scrollFraction = window.scrollY / maxScroll;
                
                if (video && video.duration) {
                    video.currentTime = video.duration * scrollFraction;
                }

                const sec1 = document.getElementById('sec-1');
                const sec2 = document.getElementById('sec-2');
                const sec3 = document.getElementById('sec-3');

                if (scrollFraction < 0.33) {
                    sec1.classList.add('active');
                    sec2.classList.remove('active');
                    sec3.classList.remove('active');
                } else if (scrollFraction < 0.66) {
                    sec1.classList.remove('active');
                    sec2.classList.add('active');
                    sec3.classList.remove('active');
                } else {
                    sec1.classList.remove('active');
                    sec2.classList.remove('active');
                    sec3.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
